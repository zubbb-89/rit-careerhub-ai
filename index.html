<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIT CareerHub AI | CodeStorm 2026</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone to compile JSX directly in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-violet-200">
    <div id="root"></div>

    <script type="text/babel">
        const App = () => {
          const [activeView, setActiveView] = React.useState('home');
          const [toast, setToast] = React.useState(null);

          const [transactions, setTransactions] = React.useState([
            { id: 'TXN1001', utr: '312345678901', studentName: 'Rahul Sharma', usn: '4RH21CS001', eventName: 'CodeStorm 2026', amount: 100, status: 'PENDING' },
            { id: 'TXN1002', utr: '312345678902', studentName: 'Priya Patel', usn: '4RH21IS042', eventName: 'CodeStorm 2026', amount: 100, status: 'VERIFIED' },
          ]);

          const [utrInput, setUtrInput] = React.useState('');
          const [targetRole, setTargetRole] = React.useState('Software Developer (Full Stack)');
          const [generatedResume, setGeneratedResume] = React.useState(null);

          const showToast = (msg) => {
            setToast(msg);
            setTimeout(() => setToast(null), 3500);
          };

          // --- SVG ICONS COLLECTION ---
          const Icons = {
            Home: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>,
            User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>,
            Briefcase: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>,
            Shield: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>,
            CreditCard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>,
            CheckCircle: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            FileText: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
            Sparkles: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>,
          };

          const handlePaymentSubmit = (e) => {
            e.preventDefault();
            if (utrInput.length < 12) {
              showToast('❌ Please enter a valid 12-digit UTR number.');
              return;
            }
            const newTxn = {
              id: 'TXN' + Math.floor(1000 + Math.random() * 9000),
              utr: utrInput,
              studentName: 'Rahul Sharma',
              usn: '4RH21CS001',
              eventName: 'CodeStorm 2026',
              amount: 100,
              status: 'PENDING'
            };
            setTransactions([newTxn, ...transactions]);
            setUtrInput('');
            showToast('✅ UTR submitted successfully! Pending admin approval.');
            setActiveView('admin');
          };

          const updateTransactionStatus = (id, newStatus) => {
            setTransactions(transactions.map(tx => tx.id === id ? { ...tx, status: newStatus } : tx));
            showToast(`⚡ Transaction ${id} marked as ${newStatus}`);
          };

          const handleGenerateResume = () => {
            showToast('🤖 AI is compiling your ATS resume...');
            setTimeout(() => {
              setGeneratedResume({
                role: targetRole,
                score: '94/100 (ATS Optimized)',
                summary: `Motivated Computer Science undergraduate at RIT Hassan specializing in ${targetRole}. Experienced in building full-stack platforms and hackathon solutions.`,
                skills: ['JavaScript (ES6+)', 'React.js', 'Node.js & Express', 'MongoDB', 'Tailwind CSS', 'Git & GitHub']
              });
              showToast('✨ Resume generated successfully!');
            }, 1000);
          };

          const renderHome = () => (
            <div className="space-y-16 animate-fadeIn">
              {/* Professional CSS Gradient Banner replacing missing images */}
              <div className="relative rounded-3xl overflow-hidden shadow-2xl border border-slate-700 bg-gradient-to-br from-slate-900 via-violet-950 to-slate-900">
                <div className="absolute inset-0 opacity-20 bg-[radial-gradient(#8b5cf6_1px,transparent_1px)] [background-size:16px_16px]"></div>
                <div className="relative px-8 py-24 md:py-32 text-center flex flex-col items-center">
                  <div className="inline-flex items-center space-x-2 bg-violet-600/20 text-violet-300 border border-violet-500/30 px-4 py-1.5 rounded-full text-sm font-semibold mb-6 backdrop-blur-sm">
                    <Icons.Sparkles /> <span>CodeStorm 2026 • Live Interactive Platform</span>
                  </div>
                  <h1 className="text-4xl md:text-6xl font-extrabold text-white tracking-tight mb-6 drop-shadow-lg">
                    One College. <span className="text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400">Every Student.</span><br/>A Better Career.
                  </h1>
                  <p className="text-lg text-slate-300 max-w-2xl mb-10 drop-shadow">
                    Centralized career development platform for engineering students at Rajeev Institute of Technology, Hassan.
                  </p>
                  <div className="flex gap-4 flex-wrap justify-center">
                    <button onClick={() => setActiveView('student')} className="bg-violet-600 text-white px-8 py-3.5 rounded-xl font-bold hover:bg-violet-700 transition shadow-lg shadow-violet-600/30">Open Student Portal</button>
                    <button onClick={() => setActiveView('payment')} className="bg-white/10 text-white border border-white/20 px-8 py-3.5 rounded-xl font-bold hover:bg-white/20 transition backdrop-blur-sm">Pay Event Fee (QR)</button>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                {[
                  { view: 'resume', icon: <Icons.FileText />, title: 'AI Resume Builder', desc: 'Instantly build professional, ATS-friendly resumes tailored for technical placements.' },
                  { view: 'portfolio', icon: <Icons.User />, title: 'MyRITfolio Websites', desc: 'Generate a unique public profile link showcasing verified achievements and hackathons.' },
                  { view: 'payment', icon: <Icons.CreditCard />, title: 'QR Payment & Gateway', desc: 'Register for hackathons, pay fees securely, and track UTR verifications.' },
                ].map((feat, i) => (
                  <div key={i} onClick={() => setActiveView(feat.view)} className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition cursor-pointer group">
                    <div className="w-12 h-12 bg-violet-100 text-violet-600 rounded-xl flex items-center justify-center mb-6 group-hover:bg-violet-600 group-hover:text-white transition">{feat.icon}</div>
                    <h3 className="text-xl font-bold text-slate-800 mb-3 group-hover:text-violet-600 transition">{feat.title}</h3>
                    <p className="text-slate-600 leading-relaxed text-sm">{feat.desc}</p>
                  </div>
                ))}
              </div>

              {/* Robust CSS Partner Badges */}
              <div className="py-12 border-t border-slate-200 text-center">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-8">Official RIT Campus Partners</h3>
                <div className="flex flex-wrap justify-center items-center gap-8">
                  <div className="px-6 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm font-extrabold text-slate-800 tracking-wider flex items-center gap-2">
                    <span className="w-3 h-3 bg-violet-600 rounded-full"></span> RIT CSE DEPARTMENT
                  </div>
                  <div className="px-6 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm font-extrabold text-slate-800 tracking-wider flex items-center gap-2">
                    <span className="w-3 h-3 bg-blue-500 rounded-full"></span> GDG ON CAMPUS RIT HASSAN
                  </div>
                </div>
              </div>
            </div>
          );

          const renderStudent = () => (
            <div className="space-y-6 animate-fadeIn">
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 flex flex-col md:flex-row items-center gap-6">
                <div className="w-24 h-24 bg-violet-600 text-white rounded-full flex items-center justify-center text-3xl font-extrabold shadow-lg">RS</div>
                <div className="flex-1 text-center md:text-left">
                  <h2 className="text-3xl font-bold text-slate-800">Rahul Sharma</h2>
                  <p className="text-slate-500 font-medium">USN: 4RH21CS001 • Department of CSE • 6th Semester</p>
                  <div className="mt-4 flex flex-wrap justify-center md:justify-start gap-2">
                    <span className="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-bold">Profile Verified</span>
                    <span className="bg-violet-100 text-violet-700 text-xs px-3 py-1 rounded-full font-bold">CodeStorm Participant</span>
                  </div>
                </div>
                <button onClick={() => setActiveView('portfolio')} className="bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold hover:bg-slate-800 transition">View MyRITfolio</button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Icons.Sparkles /> Interactive Student Actions</h3>
                  <button onClick={() => setActiveView('resume')} className="w-full text-left p-4 rounded-xl border border-slate-100 hover:border-violet-200 hover:bg-violet-50 transition flex justify-between items-center group">
                    <div>
                      <h4 className="font-bold text-slate-800 group-hover:text-violet-700">Open AI Resume Builder</h4>
                      <p className="text-sm text-slate-500">Compile instant ATS resume.</p>
                    </div>
                    <Icons.FileText />
                  </button>
                  <button onClick={() => setActiveView('payment')} className="w-full text-left p-4 rounded-xl border border-slate-100 hover:border-violet-200 hover:bg-violet-50 transition flex justify-between items-center group">
                    <div>
                      <h4 className="font-bold text-slate-800 group-hover:text-violet-700">Submit Event Fee UTR</h4>
                      <p className="text-sm text-slate-500">Pay registration fees via QR.</p>
                    </div>
                    <Icons.CreditCard />
                  </button>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                  <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.CheckCircle /> Live Transaction Status</h3>
                  <div className="space-y-3">
                    {transactions.map(tx => (
                      <div key={tx.id} className="p-3 border rounded-xl flex justify-between items-center bg-slate-50">
                        <div>
                          <p className="font-bold text-sm text-slate-800">{tx.eventName}</p>
                          <p className="text-xs font-mono text-slate-500">UTR: {tx.utr}</p>
                        </div>
                        <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${tx.status === 'VERIFIED' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                          {tx.status}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          );

          const renderAdmin = () => (
            <div className="space-y-6 animate-fadeIn">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <p className="text-sm font-semibold text-slate-500 mb-1">Total Transactions</p>
                  <h3 className="text-3xl font-extrabold text-slate-900">{transactions.length}</h3>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <p className="text-sm font-semibold text-slate-500 mb-1">Pending Approvals</p>
                  <h3 className="text-3xl font-extrabold text-amber-600">{transactions.filter(t => t.status === 'PENDING').length}</h3>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <p className="text-sm font-semibold text-slate-500 mb-1">Verified Registrations</p>
                  <h3 className="text-3xl font-extrabold text-green-600">{transactions.filter(t => t.status === 'VERIFIED').length}</h3>
                </div>
              </div>

              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                  <h2 className="text-xl font-bold text-slate-800">Live Transaction Management Panel</h2>
                  <span className="text-xs bg-violet-100 text-violet-800 px-3 py-1 rounded-full font-bold">Interactive Admin Control</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead className="bg-slate-50 text-xs uppercase tracking-wider text-slate-500 border-b border-slate-200">
                      <tr>
                        <th className="p-4">UTR / Trans ID</th>
                        <th className="p-4">Student Info</th>
                        <th className="p-4">Event</th>
                        <th className="p-4">Status</th>
                        <th className="p-4 text-right">Actions (Live Clickable)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {transactions.map((tx) => (
                        <tr key={tx.id} className="hover:bg-slate-50 transition">
                          <td className="p-4 font-mono text-sm text-slate-700">{tx.utr}</td>
                          <td className="p-4">
                            <p className="font-bold text-slate-900">{tx.studentName}</p>
                            <p className="text-xs text-slate-500">{tx.usn}</p>
                          </td>
                          <td className="p-4 text-sm text-slate-600">{tx.eventName}</td>
                          <td className="p-4">
                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                              tx.status === 'VERIFIED' ? 'bg-green-100 text-green-700' : 
                              tx.status === 'REJECTED' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'
                            }`}>{tx.status}</span>
                          </td>
                          <td className="p-4 text-right space-x-2">
                            <button onClick={() => updateTransactionStatus(tx.id, 'VERIFIED')} className="px-3 py-1 bg-green-50 text-green-600 border border-green-200 rounded text-xs font-bold hover:bg-green-100 transition">Verify</button>
                            <button onClick={() => updateTransactionStatus(tx.id, 'REJECTED')} className="px-3 py-1 bg-red-50 text-red-600 border border-red-200 rounded text-xs font-bold hover:bg-red-100 transition">Reject</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );

          const renderRecruiter = () => (
            <div className="space-y-6 animate-fadeIn">
              <div className="bg-slate-900 rounded-2xl p-8 text-white shadow-lg">
                <h2 className="text-2xl font-bold mb-2">Recruiter Portal</h2>
                <p className="text-slate-400">Discover verified engineering graduates and interns from RIT Hassan.</p>
                <div className="mt-6 flex gap-4 flex-wrap">
                  <input type="text" placeholder="Filter by skills (e.g. React, Python)..." className="flex-1 min-w-[240px] px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:ring-2 focus:ring-violet-500 outline-none" />
                  <button onClick={() => showToast('Talent filter applied successfully!')} className="bg-violet-600 px-6 py-3 rounded-xl font-bold hover:bg-violet-700 transition">Filter Talent</button>
                </div>
              </div>
            </div>
          );

          const renderPortfolio = () => (
            <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden animate-fadeIn">
              <div className="h-48 bg-gradient-to-r from-violet-600 to-indigo-700"></div>
              <div className="px-8 pb-8">
                <div className="relative flex justify-between items-end -mt-16 mb-8">
                  <div className="w-32 h-32 bg-white rounded-2xl p-2 shadow-lg border border-slate-100">
                    <div className="w-full h-full bg-violet-600 text-white rounded-xl flex items-center justify-center text-4xl font-extrabold">RS</div>
                  </div>
                  <button onClick={() => showToast('PDF Resume downloaded successfully!')} className="px-5 py-2.5 bg-slate-900 text-white text-sm font-bold rounded-xl flex items-center gap-2 hover:bg-slate-800 transition shadow-md">
                    <Icons.FileText /> Export PDF Resume
                  </button>
                </div>
                <h1 className="text-4xl font-extrabold text-slate-900 mb-1">Rahul Sharma</h1>
                <p className="text-lg text-violet-600 font-semibold mb-6">Full-Stack Web Developer • RIT Hassan CSE</p>
                <div className="p-5 border border-slate-200 rounded-2xl bg-slate-50/50">
                  <h4 className="font-bold text-slate-900 mb-1">RIT CareerHub AI (CodeStorm 2026 Project)</h4>
                  <p className="text-sm text-slate-600 mb-3">Centralized career development platform built with React & Node.js.</p>
                  <div className="flex gap-2">
                    <span className="text-xs bg-white border border-slate-200 text-slate-700 px-3 py-1 rounded-full font-bold">React</span>
                    <span className="text-xs bg-white border border-slate-200 text-slate-700 px-3 py-1 rounded-full font-bold">Tailwind CSS</span>
                  </div>
                </div>
              </div>
            </div>
          );

          const renderPayment = () => (
            <div className="max-w-md mx-auto bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden animate-fadeIn">
              <div className="bg-slate-900 text-white p-6 text-center">
                <h2 className="text-2xl font-bold mb-1">Event Fee Payment</h2>
                <p className="text-violet-300 text-xs font-semibold uppercase tracking-wider">LIVE QR GATEWAY (₹100)</p>
              </div>
              <div className="p-8 text-center">
                <p className="text-slate-600 mb-1 text-sm">Registration for</p>
                <p className="text-xl font-extrabold text-slate-900 mb-6">CodeStorm 2026 Hackathon</p>
                
                <div className="flex justify-center mb-6">
                  <div className="w-56 h-56 bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center p-4">
                     <div className="w-full h-full bg-slate-100 rounded-xl flex flex-col items-center justify-center text-slate-500 font-bold text-xs text-center p-2">
                       <svg className="w-16 h-16 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                       Scan via PhonePe / GPay
                     </div>
                  </div>
                </div>
                
                <form onSubmit={handlePaymentSubmit}>
                  <div className="text-left mb-6">
                    <label className="block text-sm font-bold text-slate-700 mb-2">Enter 12-Digit UTR / Transaction ID</label>
                    <input 
                      type="text" 
                      required 
                      minLength={12} 
                      maxLength={12} 
                      value={utrInput}
                      onChange={(e) => setUtrInput(e.target.value)}
                      className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-violet-500 focus:bg-white outline-none transition font-mono text-sm" 
                      placeholder="e.g. 312345678901" 
                    />
                  </div>
                  <button type="submit" className="w-full bg-violet-600 text-white py-3.5 rounded-xl font-bold text-lg hover:bg-violet-700 transition shadow-lg shadow-violet-600/30">Submit Payment UTR</button>
                </form>
              </div>
            </div>
          );

          const renderResume = () => (
            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 max-w-2xl mx-auto animate-fadeIn space-y-6">
              <div className="text-center">
                <div className="w-16 h-16 bg-violet-100 text-violet-600 rounded-2xl flex items-center justify-center mx-auto mb-4"><Icons.Sparkles /></div>
                <h2 className="text-3xl font-extrabold text-slate-900 mb-2">AI Resume Builder</h2>
                <p className="text-slate-600 text-sm">Select your target role and instantly generate an ATS-optimized layout.</p>
              </div>
              
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-2">Target Job Role</label>
                  <select 
                    value={targetRole} 
                    onChange={(e) => setTargetRole(e.target.value)}
                    className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-violet-500 outline-none font-medium"
                  >
                    <option>Software Developer (Full Stack)</option>
                    <option>AI / ML Engineer</option>
                    <option>Cybersecurity Analyst</option>
                    <option>Data Analyst</option>
                  </select>
                </div>
                <button onClick={handleGenerateResume} className="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold hover:bg-slate-800 transition shadow-lg">Generate ATS Resume</button>
              </div>

              {generatedResume && (
                <div className="mt-8 p-6 bg-slate-50 border border-slate-200 rounded-2xl space-y-4 animate-fadeIn">
                  <div className="flex justify-between items-center border-b pb-3">
                    <h3 className="font-bold text-slate-900">Generated Resume Preview</h3>
                    <span className="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full">{generatedResume.score}</span>
                  </div>
                  <p className="text-sm text-slate-700"><strong>Summary:</strong> {generatedResume.summary}</p>
                  <div>
                    <strong className="text-sm text-slate-900 block mb-2">Optimized Skills:</strong>
                    <div className="flex flex-wrap gap-2">
                      {generatedResume.skills.map((s, idx) => (
                        <span key={idx} className="bg-violet-100 text-violet-700 text-xs font-bold px-2.5 py-1 rounded-md">{s}</span>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );

          return (
            <div className="min-h-screen flex flex-col justify-between">
              {toast && (
                <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-6 py-3.5 rounded-2xl shadow-2xl z-50 flex items-center gap-3 animate-fadeIn border border-slate-700">
                  <Icons.CheckCircle /> <span className="text-sm font-semibold">{toast}</span>
                </div>
              )}

              <nav className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between h-20 items-center">
                    <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveView('home')}>
                      <div className="h-11 w-11 bg-violet-600 text-white font-black text-lg rounded-full flex items-center justify-center shadow-md">RIT</div>
                      <div>
                        <span className="font-extrabold text-xl tracking-tight text-slate-900 block leading-tight">CareerHub <span className="text-violet-600">AI</span></span>
                        <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">RIT Hassan • CodeStorm 2026</span>
                      </div>
                    </div>
                    
                    <div className="hidden md:flex space-x-2 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/60">
                      {[
                        { id: 'home', label: 'Home', icon: <Icons.Home /> },
                        { id: 'student', label: 'Student Portal', icon: <Icons.User /> },
                        { id: 'admin', label: 'Admin Panel', icon: <Icons.Shield /> },
                        { id: 'recruiter', label: 'Recruiters', icon: <Icons.Briefcase /> },
                      ].map((tab) => (
                        <button 
                          key={tab.id}
                          onClick={() => setActiveView(tab.id)} 
                          className={`px-5 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2 ${
                            activeView === tab.id ? 'bg-white text-violet-700 shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-200/50'
                          }`}
                        >
                          {tab.icon} {tab.label}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </nav>

              <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1">
                {activeView === 'home' && renderHome()}
                {activeView === 'student' && renderStudent()}
                {activeView === 'admin' && renderAdmin()}
                {activeView === 'recruiter' && renderRecruiter()}
                {activeView === 'portfolio' && renderPortfolio()}
                {activeView === 'payment' && renderPayment()}
                {activeView === 'resume' && renderResume()}
              </main>
              
              <footer className="bg-white border-t border-slate-200 py-12 mt-16">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-slate-500 text-sm space-y-2">
                  <p className="font-bold text-slate-800">RIT CareerHub AI — One College. Every Student. A Better Career.</p>
                  <p className="text-xs">Rajeev Institute of Technology, Hassan, Karnataka • Built for CodeStorm 2026.</p>
                </div>
              </footer>
            </div>
          );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
