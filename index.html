<!DOCTYPE html>
<html lang="en">

    <!-- React Root Container -->
    <div id="root"></div>

    <!-- Complete Application Script -->

            Briefcase: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>,

          const renderRecruiter = () => (

                <h2 className="text-2xl font-bold mb-2">Recruiter Portal</h2>

          );

          const renderResume = () => (
            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 text-center max-w-2xl mx-auto animate-fadeIn">
              <div className="w-16 h-16 bg-violet-100 text-violet-600 rounded-2xl flex items-center justify-center mx-auto mb-6"><Icons.Sparkles /></div>
              <h2 className="text-3xl font-extrabold text-slate-900 mb-3">AI Resume Builder</h2>
              <p className="text-slate-600 mb-8 text-sm">Select your target engineering profile. Our AI engine instantly formats your verified credentials into an ATS-optimized resume.</p>
              
              <div className="text-left space-y-4 mb-8">
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-2">Target Job Role</label>
                  <select className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-violet-500 outline-none font-medium">
                    <option>Software Developer (Full Stack)</option>
                    <option>AI / ML Engineer</option>
                    <option>Cybersecurity Analyst</option>
                    <option>Data Analyst</option>
                  </select>
                </div>
              </div>
              
              <button onClick={() => showToast('AI Resume successfully compiled!')} className="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold hover:bg-slate-800 transition shadow-lg">Generate ATS Resume</button>
            </div>
          );

          return (
            <div className="min-h-screen flex flex-col justify-between">
              {/* Toast Notification Popup */}
              {toast && (
                <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-6 py-3.5 rounded-2xl shadow-2xl z-50 flex items-center gap-3 animate-fadeIn border border-slate-700">
                  <Icons.CheckCircle /> <span className="text-sm font-semibold">{toast}</span>
                </div>
              )}

              {/* Main Navigation Header */}
              <nav className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between h-20 items-center">
                    
                    {/* Brand / Logo */}
                    <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveView('home')}>
                      <img src="rit_college_logo_4k.png" alt="RIT Logo" className="h-11 w-11 object-contain bg-slate-50 rounded-full p-1 border border-slate-200" onError={(e) => e.target.style.display='none'} />
                      <div>
                        <span className="font-extrabold text-xl tracking-tight text-slate-900 block leading-tight">CareerHub <span className="text-violet-600">AI</span></span>
                        <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">RIT Hassan • CodeStorm 2026</span>
                      </div>
                    </div>
                    
                    {/* Navigation Links */}
                    <div className="hidden md:flex space-x-2 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/60">
                      {[
                        { id: 'home', label: 'Home', icon: <Icons.Home /> },
                        { id: 'student', label: 'Student Portal', icon: <Icons.User /> },
                        { id: 'admin', label: 'Admin Panel', icon: <Icons.Shield /> },
                        { id: 'recruiter', label: 'Recruiters', icon: <Icons.Briefcase /> },
                      ].map((tab) => (
                        <button 
                          key={tab.id}
                          onClick={() => setActiveView(tab.id)} 
                          className={`px-5 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2 ${
                            activeView === tab.id ? 'bg-white text-violet-700 shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-200/50'
                          }`}
                        >
                          {tab.icon} {tab.label}
                        </button>
                      ))}
                    </div>

                    <div className="md:hidden">
                      <button onClick={() => setActiveView(activeView === 'home' ? 'student' : 'home')} className="p-2 bg-slate-100 rounded-xl font-bold text-xs">Menu</button>
                    </div>
                  </div>
                </div>
              </nav>

              {/* Dynamic View Body */}
              <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1">
                {activeView === 'home' && renderHome()}
                {activeView === 'student' && renderStudent()}
                {activeView === 'admin' && renderAdmin()}
                {activeView === 'recruiter' && renderRecruiter()}
                {activeView === 'portfolio' && renderPortfolio()}
                {activeView === 'payment' && renderPayment()}
                {activeView === 'resume' && renderResume()}
              </main>
              
              {/* Footer */}
              <footer className="bg-white border-t border-slate-200 py-12 mt-16">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-slate-500 text-sm space-y-2">
                  <p className="font-bold text-slate-800">RIT CareerHub AI — One College. Every Student. A Better Career.</p>
                  <p className="text-xs">Rajeev Institute of Technology, Hassan, Karnataka • Built for CodeStorm 2026 Challenge 01.</p>
                </div>
              </footer>
            </div>
          );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
